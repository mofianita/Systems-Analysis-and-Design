<!DOCTYPE html>
<html>

<head>  
    <meta charset="utf-8">
    <title>飲食規劃系統</title>
    <link href="statics/img/index.ico" rel="icon">
	  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	  <meta name="description" content="">
    <link rel="stylesheet" href="statics/css/menu.css"><!--要放.css-->
	  <link href="statics/icon/favicon.ico" type="image/x-icon" rel="icon">
	  <link href="statics/icon/favicon.ico" type="image/x-icon" rel="shortcut icon">
    <script src="statics/js/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bgimg">
		<img class="bg" src="statics/img/bgimg.png">
    <div id="container">
      <div id="header">
        <div class="title-bar">
          <p>飲食規劃系統</p>
          <a class="member" href="member.html"><img src="statics/img/member.png" alt="Member website" class="member-img"></a></li>
        </div>
          <ul>
          <li><a href="diet.html">飲食</a></li>
          <li><a href="menu.html" class="this-page">菜單</a></li>
          <li><a href="chart.html">圖表</a></li>
          <li><a href="inbody.html">身體數據</a></li>
        </ul>
      </div>
      
      <div class="TDEE">
        <h5>每日總消耗熱量TDEE</h5>
        <div class="show_TDEE"></div>
        <button onclick="sixCategories()">六大類</button>
      </div>
   
      <div class="refer_menu">
        <div class="refer_breakfast">
          <label><b>早餐</b></label>
          <div class="show_breakfast"></div>
        </div>
        <div class="refer_lunch">
          <label><b>午餐</b></label>
          <div class="show_lunch"></div>
        </div>
        <div class="refer_dinner">
          <label><b>晚餐</b></label>
          <div class="show_dinner"></div>
        </div>
      </div>
    

      <script type="text/javascript">
        var storedMemberId = sessionStorage.getItem('memberId');
        //var storedMemberId = 3; //設死使用者為test(id=3)

        function sixCategories(){
          window.location.href = 'showSixCategories.html';
        }

        function getReferMenu() { //顯示全部的飲食紀錄
          $.ajax({
              type: "GET",
              url: "api/menu.do",
              data: "id=" + storedMemberId,
              crossDomain: true,
              cache: false,
              dataType: 'json',
              timeout: 5000,
              success: function (response) {
                if(response.status == 200){
                    displayMenu(response.response.data);
                }                
                console.log(response);
              },
              error: function () {
             //   alert("回傳菜單失敗！");
              }
          });
        }
         
        function getTDEE() { //顯示全部的飲食紀錄
          $.ajax({
              type: "GET",
              url: "api/TDEE.do", 
              data: "id=" + storedMemberId,
              crossDomain: true,
              cache: false,
              dataType: 'json',
              timeout: 5000,
              success: function (response) {
                if(response.status == 200){
                    displayTDEE(response.response.data);
                }                
                console.log(response);
              },
              error: function () {
                alert("回傳TDEE失敗！");
              }
          });
        }

        //顯示Menu
        function displayMenu(data){ //要改
          $(".show_breakfast").text(data[0]['Breakfast'].join('\n'));
          $(".show_lunch").text(data[0]['Lunch'].join('\n'));
          $(".show_dinner").text(data[0]['Dinner'].join('\n'));
        }

        //顯示TDEE
        function displayTDEE(data){ //要改
          $(".show_TDEE").text(data[0]['TDEE']);
        }  
                
        $(document).ready(function() {
          getReferMenu();
          getTDEE();
        });

      </script>       
    </div>
  </div>
</body>
</html>
